name: Django CI

on:
  push:
    branches:
      - main
      - chore/github-actions
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests and code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DEBUG: "False"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Generate temporary test secret
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a") as env_file:
              env_file.write(
                  "SECRET_KEY=" + secrets.token_urlsafe(50) + "\n"
              )
          PY

      - name: Check formatting
        run: python -m black --check --diff --extend-exclude '/migrations/' src

      - name: Check lint
        run: python -m flake8 src

      - name: Scan security
        run: >
          python -m bandit -r src
          -x "*/migrations/*,*/tests/*,*/test_*.py,*/tests.py"

      - name: Check for missing migrations
        working-directory: src
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        working-directory: src
        run: |
          python -m coverage run --rcfile=../.coveragerc manage.py test
          python -m coverage report --rcfile=../.coveragerc

      - name: Generate HTML coverage report
        if: always()
        working-directory: src
        run: |
          if [ -f .coverage ]; then
            python -m coverage html --rcfile=../.coveragerc --fail-under=0
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: src/htmlcov/
          if-no-files-found: ignore