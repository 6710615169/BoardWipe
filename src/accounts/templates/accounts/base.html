<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Boardgame Profile{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; color: #222; }
        h1 { border-bottom: 2px solid #444; padding-bottom: 8px; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input[type=text], input[type=email], select, textarea {
            width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
            border: 1px solid #ccc; border-radius: 4px;
        }
        button { margin-top: 20px; padding: 10px 20px; background: #2b6cb0; color: #fff;
            border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #245a94; }
        .messages { list-style: none; padding: 0; }
        .messages li { background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .errorlist { color: #b00020; }
        .tag-list span { display: inline-block; background: #eef; padding: 4px 10px; margin: 3px;
            border-radius: 12px; font-size: 0.9em; }
        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        .profile-picture-wrap { width: 150px; height: 150px; border-radius: 50%; overflow: hidden;
            border: 3px solid #2b6cb0; background: #f7f7f7; display: flex; align-items: center; justify-content: center; }
        .profile-picture-wrap img { width: 150px; height: 150px; object-fit: cover; }
        .profile-picture-field { padding: 16px; border: 1px solid #d0d7de; border-radius: 8px; background: #f8fafc; margin-top: 8px; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 12px; }
    </style>
</head>
<body>
    <nav>
        {% if user.is_authenticated %}
            Signed in as <strong>{{ user.username }}</strong> |
            <a href="{% url 'accounts:profile' %}">My Profile</a> |
            <a href="{% url 'accounts:logout' %}">Log out</a>
        {% else %}
            <a href="{% url 'accounts:login' %}">Log in</a>
        {% endif %}
    </nav>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
        </ul>
    {% endif %}

    {% block content %}{% endblock %}
</body>
</html>
