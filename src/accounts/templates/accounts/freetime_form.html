{% extends "accounts/base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="edit-header">
    <h1>{{ title }}</h1>
    <a href="{% url 'accounts:profile' %}">&larr; Back to profile</a>
</div>

<form method="post">
    {% csrf_token %}
    <section class="edit-section">
        {{ form.as_p }}
    </section>
    <div class="form-actions">
        <a class="btn-secondary" href="{% url 'accounts:profile' %}">Cancel</a>
        <button type="submit">Save</button>
    </div>
</form>
{% endblock %}
