{% extends "accounts/base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card tile">
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p class="switch">Don't have an account? <a href="{% url 'accounts:register' %}">Register here</a></p>
</div>
{% endblock %}
