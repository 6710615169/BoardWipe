{% extends "accounts/base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-card tile">
  <h1>Register</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create account</button>
  </form>
  <p class="switch">Already have an account? <a href="{% url 'accounts:login' %}">Log in here</a></p>
</div>
{% endblock %}
