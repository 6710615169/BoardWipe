{% load chat_tags %}
{% for message in chat_messages %}
    <div class="chat-message{% if message.sender_id == user.id %} chat-message-own{% endif %}" data-id="{{ message.id }}">
        <div class="chat-bubble">{{ message.body|highlight_boardgames:boardgame_names|linebreaksbr }}</div>
        <small>{% if message.sender_id != user.id %}{{ message.sender.get_display_name }} · {% endif %}{{ message.created_at|date:"M j, H:i" }}</small>
    </div>
{% endfor %}
