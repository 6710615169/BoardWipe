{% for message in chat_messages %}
    <div class="chat-message{% if message.sender_id == user.id %} chat-message-own{% endif %}" data-id="{{ message.id }}">
        <small>{{ message.sender.get_display_name }} - {{ message.created_at|date:"M j, H:i" }}</small>
        {% if message.body %}<div>{{ message.body|linebreaksbr }}</div>{% endif %}
        {% if message.tagged_boardgame %}<div class="tag-list"><span>{{ message.tagged_boardgame }}</span></div>{% endif %}
    </div>
{% endfor %}
