<!doctype html>
<html>
  <body style="font-family: Arial, Helvetica, sans-serif; color: #222; line-height: 1.5;">
    <p>Hi {{ recipient.get_display_name }},</p>
    <p><strong>{{ sender_name }}</strong> sent you a message on BoardWipe:</p>
    <blockquote style="margin: 0 0 16px; padding: 8px 14px; border-left: 4px solid #ccc; color: #444;">
      {{ preview }}
    </blockquote>
    <p>
      <a href="{{ chat_url }}" style="display: inline-block; padding: 10px 18px; background: #2f6fdd; color: #fff; text-decoration: none; border-radius: 4px;">Read and reply</a>
    </p>
    <p style="font-size: 12px; color: #777;">
      You'll be asked to log in first if you aren't already.<br>
      Don't want these emails? <a href="{{ settings_url }}">Turn them off in your settings</a>.
    </p>
  </body>
</html>
