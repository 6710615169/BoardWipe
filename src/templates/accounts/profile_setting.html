{% extends 'base.html' %}
{% block content %}
<h2>Profile Settings</h2>

{% if messages %}
  {% for message in messages %}<p>{{ message }}</p>{% endfor %}
{% endif %}

<h3>Change Password</h3>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Change Password</button>
</form>

<form method="post" action="{% url 'logout' %}">
  {% csrf_token %}
  <button type="submit">Logout</button>
</form>
{% endblock %}
