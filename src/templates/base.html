{% load static %}
<!DOCTYPE html>
<html>

<head>
  <title>BoardWipe</title>
  <style>
    .btn {
      display: inline-block;
      padding: 8px 16px;
      background-color: #007bff;
      color: rgb(255, 255, 255);
      text-decoration: none;
      border-radius: 4px;
      border: none;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #0056b3;
    }

    .btn-danger {
      display: inline-block;
      padding: 8px 16px;
      background-color: #dc3545;
      color: rgb(255, 255, 255);
      text-decoration: none;
      border-radius: 4px;
      border: none;
      font-family: inherit;
      font-size: inherit;
      cursor: pointer;
    }

    .btn-danger:hover {
      background-color: #a71d2a;
    }
  </style>
</head>

<body>
  {% block content %}{% endblock %}
</body>

</html>
